version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: America/New_York
    open-pull-requests-limit: 5
    groups:
      root-security:
        applies-to: security-updates
        patterns:
          - '*'
      root-development-minor:
        applies-to: version-updates
        dependency-type: development
        update-types:
          - minor
          - patch
      root-runtime-patch:
        applies-to: version-updates
        dependency-type: production
        update-types:
          - patch
      # @vitest/coverage-v8 and @vitest/ui pin an exact vitest peer, so a lone major bump
      # of any one of them cannot install (closed #241). Move the family together.
      root-vitest-major:
        applies-to: version-updates
        patterns:
          - 'vitest'
          - '@vitest/*'
        update-types:
          - major
    ignore:
      # React 19 is a deliberate migration, not a Dependabot bump (see closed #206).
      - dependency-name: react
        update-types: ['version-update:semver-major']
      - dependency-name: react-dom
        update-types: ['version-update:semver-major']
      - dependency-name: '@types/react'
        update-types: ['version-update:semver-major']
      - dependency-name: '@types/react-dom'
        update-types: ['version-update:semver-major']
      # v7 ships the React Compiler rules; adopting them is a migration alongside
      # eslint 9/flat config (see closed #205).
      - dependency-name: eslint-plugin-react-hooks
        update-types: ['version-update:semver-major']
      # ESLint 9+ drops the legacy .eslintrc config this repo uses, and eslint-plugin-import
      # 2.32 caps its eslint peer at ^9, so a lone major bump cannot install (closed #247).
      # Move to flat config with the plugin majors above as one migration.
      - dependency-name: eslint
        update-types: ['version-update:semver-major']
      # drei 10 / fiber 9 require React 19; bump these with the React 19
      # migration, not piecemeal (see closed #210).
      - dependency-name: '@react-three/drei'
        update-types: ['version-update:semver-major']
      - dependency-name: '@react-three/fiber'
        update-types: ['version-update:semver-major']
      # Tailwind 4 replaces the PostCSS plugin and the JS config; adopt it as a
      # deliberate migration with visual and CSS-budget review (see closed #217).
      - dependency-name: tailwindcss
        update-types: ['version-update:semver-major']
      # framer-motion 12-14 adds ~9.3 KiB gzip to the initial bundle for no feature the
      # app uses (closed #232). Take the next major as a migration to the `motion`
      # package with LazyMotion, which can shrink the bundle instead.
      - dependency-name: framer-motion
        update-types: ['version-update:semver-major']
      # typescript-eslint 8 supports TypeScript >=4.8.4 <6.1.0, and 7.0 is the new native
      # compiler (closed #239). A 6.0.x upgrade stays allowed; revisit when
      # typescript-eslint widens its range.
      - dependency-name: typescript
        versions: ['>=6.1.0']
      # Node types should match the supported runtimes (22 and 24), not newer releases.
      - dependency-name: '@types/node'
        versions: ['>=25.0.0']

  - package-ecosystem: npm
    directory: /tools/conversion
    schedule:
      interval: weekly
      day: monday
      time: '09:30'
      timezone: America/New_York
    open-pull-requests-limit: 5
    groups:
      conversion-security:
        applies-to: security-updates
        patterns:
          - '*'
      conversion-development-minor:
        applies-to: version-updates
        dependency-type: development
        update-types:
          - minor
          - patch
      conversion-runtime-minor:
        applies-to: version-updates
        dependency-type: production
        update-types:
          - minor
          - patch
    ignore:
      # TypeScript 7 is the new native compiler; adopt it as a deliberate migration.
      - dependency-name: typescript
        versions: ['>=7.0.0']
      # Node types should match the supported runtimes (22 and 24), not newer releases
      # (closed #236).
      - dependency-name: '@types/node'
        versions: ['>=25.0.0']

  - package-ecosystem: npm
    directory: /tools
    schedule:
      interval: weekly
      day: monday
      time: '09:45'
      timezone: America/New_York
    open-pull-requests-limit: 3
    groups:
      legacy-tools-security:
        applies-to: security-updates
        patterns:
          - '*'
      legacy-tools-runtime-minor:
        applies-to: version-updates
        dependency-type: production
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '10:00'
      timezone: America/New_York
    open-pull-requests-limit: 3
    groups:
      github-actions-minor:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
